[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "targeted-tool-data-factory"
version = "0.1.0"
description = "Target-conditioned, program-first, executor-verified tool-use data generation (first target: NESTFUL; first student: Qwen3-4B)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "jsonschema>=4.17",
    "attrs>=23.1",
    "ortools>=9.10",
]

[project.optional-dependencies]
analysis = ["scipy>=1.10", "scikit-learn>=1.3", "rapidfuzz>=3.0"]
local-llm = ["transformers>=4.40", "torch>=2.1", "accelerate>=0.30"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
targeted-data = "targeted_tool_data.pilot43_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
