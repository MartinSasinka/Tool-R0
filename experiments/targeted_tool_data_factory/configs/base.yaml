# Base configuration — engineering thresholds and generic defaults.
student:
  model_id: Qwen/Qwen3-4B-Instruct-2507   # exact trainer checkpoint (nestful_mtgrpo_partial/config.yaml)

provider:
  kind: template_only          # template_only | openai_compatible_local | transformers_local
  base_url: "http://127.0.0.1:1234/v1"   # used only for openai_compatible_local
  model: ""                    # local server model name
  cache: true                  # content-hash cache for all LLM outputs

generation:
  candidates: 1500
  max_candidates: 5000
  rng_seed: 20260726
  tracks: [adaptation, generalization]
  adaptation_ratio: 0.60

selection:
  n_validated_target: [400, 800]
  n_selected: 320
  split: {train: 160, heldout: 80, reserve: 80}

thresholds:            # configurable engineering criteria, not scientific laws
  jsd_warn: 0.10
  auc_warn: 0.75
  template_max_share: 0.05
  cell_max_share: 0.10
  hard_distractor_min_task_share: 0.50
  near_dup_query_ratio: 95       # rapidfuzz token_set_ratio within pool
  contamination_ratio: 90        # rapidfuzz ratio vs target queries
  answer_tolerance: 1.0e-6
  minimal_path_max_depth: 3
  minimal_path_max_evals: 20000

probe:
  enabled: true
  p1_pool: 200          # candidates receiving 1 greedy rollout
  p2_pool: 120          # candidates receiving 4 rollouts
  p3_pool: 40           # borderline/final candidates, 8 rollouts
  informative_band: [0.125, 0.875]
