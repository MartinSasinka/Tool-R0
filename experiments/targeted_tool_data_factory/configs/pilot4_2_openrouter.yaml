# Pilot4.2 OpenRouter — pinned models, no free/auto/latest.
openrouter:
  enabled: true
  writer_model: openai/gpt-4o-mini-2024-07-18
  critic_model: google/gemini-2.5-flash-lite
  audit_model: google/gemini-2.5-flash-lite
  allow_fallbacks: false
  require_structured_outputs: true
  reasoning_effort: none
  temperature: 0.5
  max_output_tokens: 1024
  max_retries: 2
  request_timeout_seconds: 120
  max_total_cost_usd: 20
  max_cost_per_task_usd: 0.02
  cache_system_prompt: true
