# NESTFUL target configuration. All NESTFUL-specific paths/knobs live here
# and in targets/nestful/.
name: nestful
adapter: targets.nestful

data:
  # Profiling source (dev/calibration ONLY — hygiene rule D03)
  dev_path: ../nestful_mtgrpo_minimal/data/splits/nestful_dev.jsonl
  # Contamination blocklist ONLY (never profiled, never seeds)
  test_path: ../nestful_mtgrpo_minimal/data/splits/nestful_test.jsonl
  # Old dataset for profile-match comparison
  stage3_path: ../nestful_synthetic_curriculum_v3/data/training_ready_v5/filtered/stage3_train_ready.jsonl

profile:
  call_count_buckets: ["2", "3", "4", "5", "6+"]
  offered_tools_buckets: {small: [1, 9], medium: [10, 12], large: [13, 40]}

# Student failure profile — measured Qwen3-4B (C0) behavior, forensic audit
# 2026-07-25 (reports/root_cause_forensic/analysis/a05_eval_audit.json).
failure_profile:
  taxonomy_counts_c0_500:
    official_success: 285
    parse_or_no_call: 45
    executable_wrong_result: 129
    executable_partial: 32
    execution_failure: 9
  win_rate_by_call_bucket: {"2": 0.45, "3": 0.62, "4+": 0.593}
  dominant_failures: [too_few_calls, no_tool_call, executable_wrong_final]
  undercalling_rate: 0.674

# A-track surface conventions (morphology, not copies)
adaptation:
  core_math_names: [add, subtract, multiply, divide, power, inverse, sqrt, negate, floor]
  param_styles: [semantic, generic]     # generic = arg_0/arg_1 (seen in test split)
  label_styles: ["$var{i}", "$var_{i}"]
