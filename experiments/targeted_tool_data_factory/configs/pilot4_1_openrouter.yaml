# Pilot4.1 OpenRouter config — pinned models only, no free/auto/latest.
openrouter:
  enabled: true
  writer_model: mistralai/mistral-small-24b-instruct-2501
  critic_model: google/gemini-2.5-flash-lite
  audit_model: google/gemini-2.5-flash-lite
  exact_provider: null
  allow_fallbacks: false
  require_structured_outputs: true
  reasoning_effort: none
  temperature: 0.7
  max_output_tokens: 1024
  max_retries: 2
  request_timeout_seconds: 120
  max_total_cost_usd: 20
  max_cost_per_task_usd: 0.02
  cache_system_prompt: true
