# pilot2: semantic core v2 (typed answers, unit-aware plausibility, real
# fan-in, configurable hard-distractor share) + OpenRouter surface paraphrasing.
# pilot1 (configs/pilot_local.yaml) is untouched and stays frozen.
extends: base.yaml

version: pilot2

generation:
  engine: v2
  candidates: 2500
  max_candidates: 5000
  # NESTFUL dev answer profile with the float share pinned into the 78-82 %
  # band demanded for pilot2 (pilot1 was ~97 % float)
  answer_kind_shares:
    float: 0.80
    list: 0.07
    string: 0.05
    int: 0.04
    bool: 0.02
    numeric_string: 0.02
  # 70-90 % band; the remainder gets ordinary offered sets so the student does
  # not only ever see maximally adversarial tool menus
  hard_distractor_share: 0.8

selection:
  n_selected: 320
  split:
    train: 160
    heldout: 80
    reserve: 80

paraphrase:
  enabled: true
  provider: openrouter_paraphrase
  # fixed, cheap, non-Qwen instruct model (never openrouter/auto)
  model: mistralai/mistral-small-24b-instruct-2501
  base_url: https://openrouter.ai/api/v1
  # A paraphrase only counts if it provably preserves the program, and that
  # gets much harder as the program grows. Measured survival rate by call
  # count on the first 600 requests:
  expected_accept_rate: {2: 0.64, 3: 0.28, 4: 0.34, 5: 0.11, 6: 0.23}
  # so the shortlist has to be ~4x the number of paraphrases the selected pool
  # needs, weighted towards the long-horizon cells
  shortlist: 1800
  variants: 2
  temperature: 0.7
  max_tokens: 480
  max_chars: 420
  # The USD cap is the guard that matters and is left at the mandated 2.00.
  # The request cap is raised from the 600 default because the measured cost is
  # ~$0.00003/request: 600 requests bought $0.015 of paraphrasing, three orders
  # of magnitude under the money guard, while starving the long-horizon cells.
  max_requests: 2000
  max_usd: 2.0
  # share of the SELECTED pool that should carry an accepted paraphrase
  selected_share: 0.65

probe:
  enabled: true
  p1_pool: 320
  p2_pool: 160
  p3_pool: 64
  informative_band: [0.125, 0.875]

provider:
  kind: template_only
