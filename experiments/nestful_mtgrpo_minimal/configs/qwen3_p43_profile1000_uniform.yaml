# Run A — control: PROFILE_1000 + uniform sampling
# Ablation twin of qwen3_p43_profile1000_dynamic (identical hypers except sampler).
experiment:
  name: qwen3_p43_profile1000_uniform
  seed: 42
  output_dir: outputs/qwen3_p43_profile1000_uniform

paths:
  train_jsonl: ../targeted_tool_data_factory/outputs/pilot4_3_nestful_profile_1000/train_nestful_profile_1000.jsonl
  enrichment_jsonl: ../targeted_tool_data_factory/outputs/pilot4_3_nestful_profile_1000/train_nestful_enrichment_500.jsonl
  eval_jsonl: ../targeted_tool_data_factory/outputs/pilot4_3_nestful_profile_1000/train_nestful_profile_1000.jsonl
  all_stages_jsonl: null
  full_nestful_jsonl: data/NESTFUL-main/data_v2/nestful_data.jsonl
  ibm_functions_dir: data/NESTFUL-main/data_v2/executable_functions
  synthetic_tools_dir: ../targeted_tool_data_factory/trainer_adapter_p43

model:
  base_model: Qwen/Qwen3-4B-Instruct-2507
  lora_adapter: null
  output_adapter_dir: outputs/qwen3_p43_profile1000_uniform/checkpoints
  revision: null  # pin after probe resolves huggingface revision hash

executor:
  mode: synthetic
  ibm_call_timeout: 30.0

hardware:
  device: auto
  num_gpus: auto
  bf16: true
  gradient_checkpointing: true
  load_in_4bit: true
  qlora: true
  use_vllm: true
  vllm_tensor_parallel_size: 1
  vllm_gpu_memory_utilization: 0.45
  vllm_enforce_eager: false
  vllm_weight_sync: after_epoch
  rollout_data_parallel_gpus: null
  use_flash_attention: false

finetuning:
  method: qlora
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: auto
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

data:
  train_stage: null          # do NOT filter by num_calls — profile spans 2..6+
  eval_stage: null
  max_train_tasks: null
  max_eval_tasks: 64
  mixed_replay: false
  eval_paradigm: react
  num_icl_examples: 1

generation:
  max_turns: auto
  max_extra_turns_eval: 1
  max_new_tokens_smoke: 1024
  max_new_tokens_train: 2048
  max_new_tokens_eval: 2560
  max_new_tokens_direct: 1024
  max_new_tokens: 2048
  max_prompt_tokens: 4096
  max_model_length: 6144
  temperature: 0.7
  top_p: 0.95
  num_generations: 8         # group_size = 8 (fixed for this experiment)

training:
  epochs: 1
  learning_rate: 1.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  kl_beta: 0.02
  max_grad_norm: 1.0
  save_every_epoch: true
  eval_after_epoch: false
  mask_clipped_from_update: true
  single_turn: false
  early_abort_checks: true
  early_abort_dead_rate_first_50: 0.95

reward:
  # Graded process signal required so ALL_FAIL_WITH_PROGRESS is observable.
  # Identical for A/B/C ablation.
  train_policy: execution_aware
  final_eval_shadow_policy: solution_equivalent
  binary_only: false
  format_as_gate: true

mt_grpo:
  enabled: true
  mode: turn_level_minimal
  gamma: 1.0
  lambda_episode: 1.0
  normalize_advantage: true
  fallback_episode_level_if_needed: true

sampler:
  mode: uniform_profile
  sampler_mode: uniform_profile
  group_size: 8
  reward_variance_epsilon: 1.0e-6
  target_effective_groups: 0          # 0 = consume full planned epoch (all prompts)
  initial_oversample_factor: 1.0
  max_oversample_factor: 1.0
  max_refill_rounds: 0
  allow_cross_pool_refill: false
  minimum_prompt_weight: 0.05
  ema_alpha: 0.1
  revisit_after_steps: 50
  version: nestful_profile.v1

logging:
  use_wandb: false
  wandb_project: nestful-mtgrpo-p43
  log_samples: true
